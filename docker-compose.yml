services:
  immich-public-proxy:
    build: .
    container_name: immich-public-proxy-gps
    restart: always
    ports:
      - "3000:3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    environment:
      IMMICH_URL: http://your-immich-server:2283
      PUBLIC_BASE_URL: https://your-proxy-url.com
    volumes:
      - ./config.json:/app/config.json:ro
    healthcheck:
      test: curl -sf -m 4 http://localhost:3000/share/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s

